<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>教师拓扑 SVG 预览</title>
  <style>
    body {
      margin: 0;
      background: #071422;
      color: #cbd5e1;
      font-family: Arial, Helvetica, sans-serif;
      padding: 32px 40px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #22d3ee;
      font-weight: 650;
    }
    p {
      margin: 0 0 28px;
      font-size: 13px;
      color: #94a3b8;
    }
    h2 {
      margin: 28px 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #67e8f9;
      letter-spacing: .04em;
    }
    .row {
      display: flex;
      gap: 36px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    figure {
      margin: 0;
      text-align: center;
    }
    figure img {
      display: block;
      margin: 0 auto;
    }
    figcaption {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
    .tile {
      background: #0b1c2c;
      border: 1px solid rgba(34, 211, 238, .18);
      border-radius: 14px;
      padding: 18px 20px 14px;
    }
  </style>
</head>
<body>
  <h1>教师拓扑真 SVG 预览</h1>
  <p>按上传线框图重绘的一套四枚。画板 128×128，描边 #22d3ee，无渐变。未替换运行时资源。</p>

  <h2>96px · 接近拓扑节点实际大小</h2>
  <div class="row">
    <figure class="tile"><img src="pc.svg?v=6" width="96" height="96" alt="PC" /><figcaption>PC</figcaption></figure>
    <figure class="tile"><img src="switch.svg?v=6" width="96" height="96" alt="交换机" /><figcaption>交换机</figcaption></figure>
    <figure class="tile"><img src="router.svg?v=6" width="96" height="96" alt="路由器" /><figcaption>路由器</figcaption></figure>
    <figure class="tile"><img src="tap.svg?v=6" width="96" height="96" alt="网络分流器" /><figcaption>网络分流器</figcaption></figure>
  </div>

  <h2>64px</h2>
  <div class="row">
    <figure class="tile"><img src="pc.svg?v=6" width="64" height="64" alt="PC" /><figcaption>PC</figcaption></figure>
    <figure class="tile"><img src="switch.svg?v=6" width="64" height="64" alt="交换机" /><figcaption>交换机</figcaption></figure>
    <figure class="tile"><img src="router.svg?v=6" width="64" height="64" alt="路由器" /><figcaption>路由器</figcaption></figure>
    <figure class="tile"><img src="tap.svg?v=6" width="64" height="64" alt="网络分流器" /><figcaption>网络分流器</figcaption></figure>
  </div>

  <h2>128px</h2>
  <div class="row">
    <figure class="tile"><img src="pc.svg?v=6" width="128" height="128" alt="PC" /><figcaption>PC</figcaption></figure>
    <figure class="tile"><img src="switch.svg?v=6" width="128" height="128" alt="交换机" /><figcaption>交换机</figcaption></figure>
    <figure class="tile"><img src="router.svg?v=6" width="128" height="128" alt="路由器" /><figcaption>路由器</figcaption></figure>
    <figure class="tile"><img src="tap.svg?v=6" width="128" height="128" alt="网络分流器" /><figcaption>网络分流器</figcaption></figure>
  </div>
</body>
</html>
