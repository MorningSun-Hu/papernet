# PaperNet same-host reverse proxy.
# Teacher process: 127.0.0.1:8080 (PAPERNET_BIND).
# Static UI: copy dist/teacher and dist/student from scripts/build-web.sh
# into /var/www/papernet/teacher and /var/www/papernet/student.

upstream papernet_teacher {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
    }

    location /ws {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
    }

    location /teacher/ {
        alias /var/www/papernet/teacher/;
        try_files $uri $uri/ /teacher/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /student/ {
        alias /var/www/papernet/student/;
        try_files $uri $uri/ /student/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
