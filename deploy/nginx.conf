# PaperNet reverse proxy only.
# Teacher process binds 127.0.0.1:80 (PAPERNET_BIND) and serves pages + /api + /ws.
# Nginx listens on 8080 and forwards everything. It does not serve static files.

upstream papernet_teacher {
    server 127.0.0.1:80;
}

server {
    listen 8080;
    server_name _;

    location /ws {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
    }
}
