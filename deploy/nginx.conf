# PaperNet: Nginx serves UI on 8080 and proxies API/WS to the teacher on 127.0.0.1:80.
# Copy runtime/teacher and runtime/student into /var/www/papernet/.
# Use root + try_files. Do not combine alias with try_files (redirect cycle).

upstream papernet_teacher {
    server 127.0.0.1:80;
}

server {
    listen 8080;
    server_name _;
    root /var/www/papernet;

    location = /teacher {
        return 301 /teacher/;
    }

    location = /student {
        return 301 /student/;
    }

    location /api/ {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
    }

    location /ws {
        proxy_pass http://papernet_teacher;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Classroom-Id $http_x_classroom_id;
        proxy_set_header X-Connection-Id $http_x_connection_id;
        proxy_set_header X-Client-Kind $http_x_client_kind;
    }

    location /teacher/ {
        try_files $uri $uri/ /teacher/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /student/ {
        try_files $uri $uri/ /student/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
