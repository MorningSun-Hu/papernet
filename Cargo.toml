[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/teacher",
    "crates/student",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/MorningSun-Hu/papernet"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
